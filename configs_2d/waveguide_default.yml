experiment:
  name: "WAVEGUIDE"
  description: "Single straight waveguide to test leakage in Split-Step methods."

physics:
  wavelength_um: 0.635
  probe_dia_um: 8.0
  probe_focus_um: 0.0

grid:
  n_physical: 5096
  n_padding: 2048
  physical_width_um: 150.0

sample:
  type: "WAVEGUIDE"
  thickness_um: 200.0

  # Ground Truth Settings (Reference Solution)
  ground_truth:
    n_prop_fine: 1024      # High-res propagation steps for reference
    solver_type: "MULTISLICE"    # Which algorithm to trust as "truth"
    solver_params:
      transform_type: "DST"
      symmetric: True

    # # To SAVE the computed ground truth for later reuse:
    save_file: "./data/waveguide_gt_ref.npz"

    # # To LOAD a previously computed ground truth (skips generation):
    #load_file: "./data/waveguide_gt_ref.npz"

  # Sample Generator Parameters
  params:
    delta_n: 0.01         # Scattering strength
    beta_n: 0.001        # Absorption
    width_um: 8.0
    n_background: 1.0

# Benchmarking List
solvers:
  - name: "Multislice (first order)"
    type: "MULTISLICE"
    solver_params:
        transform_type: "FFT"
        symmetric: False

  - name: "Multislice (second order)"
    type: "MULTISLICE"
    solver_params:
        transform_type: "FFT"
        symmetric: True

  - name: "Pade (Order 4)"
    type: "PADE"
    solver_params:
      pade_order: 4

  - name: "Spectral Pade (Order 4)"
    type: "SPECTRAL_PADE"
    solver_params:
      pade_order: 4
      n_iter: 50

  - name: "Pade Sum (Order 4)"
    type: "PADE_SUM"
    solver_params:
      pade_order: 4

  - name: "Pade Sum (Order 2)"
    type: "PADE_SUM"
    solver_params:
      pade_order: 2

  - name: "Wavelet (Aggressive, Fast)"
    type: "WAVELET_MULTISLICE"
    solver_params:
      wv_family: "sym4"    # Shorter filter (faster matrix)
      wv_level: 4          # Deeper level (better compression)
      v_s: 1e-2            # High threshold
      symmetric: False      # Use symmetric propagation for better accuracy

  - name: "Wavelet (Balanced)"
    type: "WAVELET_MULTISLICE"
    solver_params:
      wv_family: "sym6"
      wv_level: 3
      v_s: 5e-4            # Moderate threshold
      symmetric: False

  - name: "Wavelet (High Accuracy)"
    type: "WAVELET_MULTISLICE"
    solver_params:
      wv_family: "db8"     # Smoother filter (fewer artifacts)
      wv_level: 3
      v_s: 1e-5            # Strict threshold
      symmetric: False

benchmark:
  step_counts: [4, 8, 16, 32, 64, 128]  # List of step counts to test
  save_beam_idx: 0
