experiment:
  name: "BLOBS_3D_SOLVER_COMP"
  description: "Comparing Standard vs. Parallel-in-Time 3D Solvers."

physics:
  wavelength_um: 0.001756    # Soft X-ray (706 eV)
  probe_dia_um: 0.015        # 15 nm probe
  probe_focus_um: -0.050     # 50 nm defocus

grid:
  n_physical: 256            # 2D Transverse grid
  n_padding: 256              # Padding for FFT boundary safety
  physical_width_um: 0.250   # 250 nm FOV

sample:
  type: "BLOBS"
  thickness_um: 0.600        # 600 nm total thickness

  ground_truth:
    n_prop_fine: 500         # 1.5 nm steps for truth
    save_beam: False         # Set to True only if you need to plot 3D cross-sections
    solver_type: "PADE"
    solver_params:
      pade_order: 12

  params:
    n_background: 1.0
    delta_n: -1.5e-2
    beta_n: 2.0e-3
    n_blobs: 500

# ==========================================
# 3D Benchmarking List
# ==========================================
solvers:
  - name: "3D Multislice (Symmetric)"
    type: "MULTISLICE"
    solver_params:
      symmetric: True
      use_gpu: False

  - name: "3D Multislice (Non-Sym)"
    type: "MULTISLICE"
    solver_params:
      symmetric: False
      use_gpu: False

  - name: "3D Pade ABC(Order 12, Cross Terms order 0)"
    type: "PADE_ABC"
    solver_params:
      pade_order: 12
      cross_term_order: 0

  - name: "3D Pade (Order 12, Cross Terms order 0)"
    type: "PADE"
    solver_params:
      pade_order: 12
      cross_term_order: 0

benchmark:
  step_counts: [4, 8, 16, 32, 64, 128]  # List of step counts to test
  save_beam_idx: 0
  n_repeats: 1
